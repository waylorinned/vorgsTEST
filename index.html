<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>vorgster kombat - 2D SANDBOX FINAL</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="script.js" defer></script>
  <style>
    /* Стили для 2D песочницы */
    .map-wrapper { position: relative; overflow: hidden; border: 2px solid #333; border-radius: 8px; height: 60vh; touch-action: none; }
    
    .draggable-hud { position: absolute; z-index: 20; transition: border 0.2s, background 0.2s; }
    .hud-edit-mode .draggable-hud { border: 2px dashed #0f0 !important; background: rgba(0, 255, 0, 0.2) !important; cursor: move; }
    
    .hotbar-slot {
      width: 45px; height: 45px; background: rgba(0,0,0,0.7); border: 2px solid #555;
      border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: 0.1s; position: relative;
    }
    .hotbar-slot.active { border-color: #0f0; background: rgba(0,255,0,0.3); transform: scale(1.1); z-index: 2; box-shadow: 0 0 10px #0f0; }
    .hotbar-icon { font-size: 20px; line-height: 1; margin-top: -5px; }
    .hotbar-label { font-size: 8px; color: #fff; font-weight: bold; position: absolute; bottom: 2px; text-shadow: 1px 1px 0 #000; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="text-align:center; color:#0ff; font-weight:bold; padding:10px;">🛠️ SANDBOX: РЕДАКТОР 2D МИРА 🛠️</div>
    </div>

    <div id="tab-anarchy" class="tab-content active">
      <div class="upgrade-list" style="padding-top:5px;">
        
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
          <div class="section-title" style="margin:0;">МИР И ФИЗИКА</div>
          <button class="buy-btn gold" id="btn-edit-hud" onclick="toggle_hud_edit()" style="padding: 5px 10px; font-size: 10px;">РЕДАКТИРОВАТЬ HUD</button>
        </div>

        <div class="map-wrapper" id="map-wrapper">
          <canvas id="rtp-canvas"></canvas>
          
          <!-- ДРАГГАБЛ 1: Координаты -->
          <div id="hud-coords" class="draggable-hud" style="top: 10px; left: 10px;">
            <div style="background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 12px; color: #fff;">
              X: <span id="map-x">0</span> Y: <span id="map-y">0</span> | <span id="time-display">☀️ День</span>
            </div>
          </div>

          <!-- ДЖОЙСТИК (Не перетаскивается, он прибит слева внизу) -->
          <div class="joystick-zone" id="joystick-zone" style="z-index: 25;"><div class="joystick-knob" id="joystick-knob"></div></div>
          
                   <!-- ДРАГГАБЛ 2: Хотбар строительства -->
          <div id="hud-hotbar" class="draggable-hud" style="bottom: 15px; left: 10px; max-width: 70vw; overflow-x: auto; border-radius: 8px;">
            <div style="display:flex; gap:6px; padding-bottom: 5px;">
              <div class="hotbar-slot active" data-block="0" onclick="select_slot(0)"><div class="hotbar-icon">⛏️</div><div class="hotbar-label">Кирка</div></div>
              <div class="hotbar-slot" data-block="1" onclick="select_slot(1)"><div class="hotbar-icon">🟫</div><div class="hotbar-label">Земля</div></div>
              <div class="hotbar-slot" data-block="2" onclick="select_slot(2)"><div class="hotbar-icon">🪨</div><div class="hotbar-label">Камень</div></div>
              <div class="hotbar-slot" data-block="8" onclick="select_slot(8)"><div class="hotbar-icon">🪵</div><div class="hotbar-label">Дерево</div></div>
              <div class="hotbar-slot" data-block="3" onclick="select_slot(3)"><div class="hotbar-icon">⬛</div><div class="hotbar-label">Обса</div></div>
              <div class="hotbar-slot" data-block="9" onclick="select_slot(9)"><div class="hotbar-icon">🔮</div><div class="hotbar-label">Чары</div></div>
            </div>
          </div>


          <!-- ДРАГГАБЛ 3: Кнопки действий -->
          <div id="hud-actions" class="draggable-hud" style="bottom: 15px; right: 15px;">
            <div style="display:flex; flex-direction:column; gap:12px; align-items:flex-end;">
              <button class="buy-btn gold" style="width:40px; height:40px; border-radius:50%; font-size:16px; padding:0;">🍎</button>
              <button class="buy-btn purple" style="width:50px; height:50px; border-radius:50%; font-size:18px; padding:0;">🔮</button>
              <button class="buy-btn blue" style="width:65px; height:65px; border-radius:50%; font-size:24px; padding:0; box-shadow: 0 0 10px rgba(0,100,255,0.5);" id="btn-jump">⬆️</button>
            </div>
          </div>

        </div>

        <div style="background:#111; padding:15px; border-radius:8px; border:1px solid #333; margin-top: 10px;">
          <div style="text-align:center; color:#aaa; font-size:12px;">
            <b>ИНСТРУКЦИЯ:</b><br>
            Джойстик — бег. Кнопка ⬆️ — прыжок.<br>
            Нажми "РЕДАКТИРОВАТЬ HUD", чтобы двигать кнопки и блоки по экрану.<br>
            Время суток меняется само. Анимации работают при беге.
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
